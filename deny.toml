# cargo-deny - dependency-graph security / license / source policy for mtp2.
# Local: `cargo deny check`  ·  CI: .github/workflows/audit.yaml
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = true

[advisories]
# A yanked crate or an open RustSec advisory fails the audit.
version = 2
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
# mtp2 is pure Rust: the only runtime dependency is thiserror (and, behind the
# `python` feature, pyo3). No C libraries are linked, so there is no C-FFI ban
# list here. A future hardware binding (E1/T1 card driver) would live behind its
# own feature / sibling crate and bring its own policy.

[licenses]
# The crate is MIT; keep dependencies OSI-permissive.
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    # MPL-2.0 is deliberately absent. It was the only non-permissive licence on
    # this list and nothing in the tree uses it, so pre-approving weak copyleft
    # only meant a future dependency could introduce it without anyone looking.
    # Re-add it as a deliberate decision, never to make a build pass.
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
